name: Validate kiro-all-docs

# 対象ブランチは main のみ。
# 本サイトは「時点を明記した紹介文書」であり、公式更新の毎日の監視は姉妹サイトの役割。
# したがって schedule（nightly）は置かない（作業計画 §7-2）。
on:
  push:
    branches: [ main ]
    paths:
      - 'kiro-all-docs/**'
      - 'README.md'
      - 'scripts/kiro-all-docs/**'
      - 'Makefile'
      - '.github/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'kiro-all-docs/**'
      - 'README.md'
      - 'scripts/kiro-all-docs/**'
      - 'Makefile'
      - '.github/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 公開範囲の機械検証。ローカル管理対象（work_plans / 06_embedded-docs /
      # work_records）が公開ツリーに混入していないか、公開ファイルにローカル絶対パスが
      # 混じっていないかを見る。公開事故は取り返しがつかないので最初に実行する。
      - name: 公開範囲チェック（ローカル管理対象・ローカル絶対パスの混入）
        run: make check-kiro-all-ignore

      # ネットワーク不要の全チェック（links / notation / sources / quotes / first-person）。
      - name: 全チェック（ネットワーク不要）
        run: make check-kiro-all-all

      # 外部サイトに依存するチェックは PR では実行しない（レート制限・一時障害で
      # PR が赤くなるのを避ける）。push / 手動で実施する。
      # 重要 URL のみに絞ることで、外部要因の failure と本当のリンク切れを切り分けやすくする。
      - name: 重要 URL の到達性（PR ではスキップ）
        if: github.event_name != 'pull_request'
        run: make check-kiro-all-urls-important
